<!doctype html>
<html lang="en">
<head>

<meta name="color-scheme" content="dark">
<title>Sponsor Radar</title>

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..650&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0D12; --bg-2: #0e1118; --panel: #151922; --panel-hover: #1b222d;
    --cyan: #71E6F2; --cyan-hi: #A0F2F8; --text: #F3F5F7; --muted: #A3AAB7; --dim: #7d8594;

    --ghost: #8a92a1; --ghost-bg: rgba(138,146,161,.16);

    --body: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {

    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: repeating-linear-gradient(45deg, rgba(163,170,183,.06) 0 1px, transparent 1px 46px), repeating-linear-gradient(-45deg, rgba(163,170,183,.06) 0 1px, transparent 1px 46px);
    -webkit-mask-image: radial-gradient(ellipse 80% 38% at 85% 0%, #000, transparent 72%);
    mask-image: radial-gradient(ellipse 80% 38% at 85% 0%, #000, transparent 72%);
  }
  .wrap { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; min-width: 0; }

  label.l { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 550; }
  input[type="text"], input[type="password"], input[type="search"], textarea, select.f {

  }
  textarea { resize: vertical; }

  .btn:hover { border-color: var(--cyan); color: var(--cyan); }

  .seg > * { flex: 1; text-align: center; padding: 0 6px; min-height: 42px; display: grid; place-items: center; border-radius: 10px; font: 600 14px var(--body); color: var(--muted); text-decoration: none; border: 0; background: transparent; cursor: pointer; }
  .seg > [aria-pressed="true"], .seg > [aria-current="true"] { background: var(--panel-hover); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .seg.st > [aria-pressed="true"].st-none { background: var(--none-bg); color: var(--text); box-shadow: inset 0 0 0 1px var(--none); }
  .seg.st > [aria-pressed="true"].st-cold { background: var(--cold-bg); color: var(--cold); box-shadow: inset 0 0 0 1px var(--cold); }

  .seg.st > [aria-pressed="true"].st-ghost { background: var(--ghost-bg); color: var(--text); box-shadow: inset 0 0 0 1px var(--ghost); }
  .fchips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }

  .fchip b { font-weight: 650; color: var(--text); margin-left: 4px; }

  .fchips.wrap { flex-wrap: wrap; overflow: visible; padding-bottom: 2px; margin: 0; width: 100%; }
  .fchip.sep { margin-left: 6px; }

  .stat b { display: block; font: 650 26px/1.1 var(--display); letter-spacing: -.03em; }
  .stat span { font-size: 12.5px; color: var(--muted); }

  details.item:hover { background: var(--panel-hover); }

  details.item > summary::-webkit-details-marker { display: none; }

  details.item[open] > summary::after { transform: rotate(-135deg); margin-bottom: -3px; }
  details.item.done .main, details.item.done .rb { opacity: .42; }
  .rb { position: relative; flex: none; width: 40px; height: 40px; display: grid; place-items: center; color: var(--muted); font: 650 13px var(--display); }
  .rb svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

  .rb b { position: relative; font-weight: 650; }
  .rb.on { color: var(--ink); }

  .meta { font-size: 13px; color: var(--muted); }

  .bar.big { height: 8px; margin-top: 0; border: 1px solid var(--line-soft); }

  a.chip:hover { border-color: var(--cyan); }

  .chip.rec { color: var(--warm); border-color: rgba(245,177,76,.5); }
  .lbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
  ul.vids { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
  ul.vids a { overflow-wrap: anywhere; }

  details.sub { border: 1px solid var(--line-soft); border-radius: 12px; background: var(--bg-2); }

  details.sub > summary::-webkit-details-marker { display: none; }

  details.sub[open] > summary::after { transform: rotate(-135deg); margin-bottom: -3px; }

  .erow .btn { flex: none; }
  .hmail { display: flex; gap: 8px; align-items: center; }
  .hmail .btn { flex: none; }
  :root { --p1: #71E6F2; --p2: #8CA9FF; --p3: #F5B14C; --p4: #FF7A66; --p5: #B58CFF; --p6: #7BE0A4; --pother: #3a4252; }
  .kbody { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 16px; }

  .hstat b { display: block; font: 650 18px/1.15 var(--display); letter-spacing: -.02em; overflow-wrap: anywhere; }

    else if (t.id === 'esDepth') { ui.esDepth = t.value; render(true); }
    else if (t.id === 'esWho') { ui.esWho = t.value; render(true); }
    else if (t.id === 'esWeb') { ui.esWeb = t.checked; render(true); }
    else if (t.id === 'bLimit') { ui.bLimit = t.value; refreshSubSummary(); }
    else if (t.dataset && t.dataset.sub) { if (t.checked) ui.subSel.add(t.dataset.sub); else ui.subSel.delete(t.dataset.sub); refreshSubSummary(); }
    else if (t.classList && t.classList.contains('stsel')) {
      setStatus(t.dataset.id, t.value); rerenderBody($('#creatorsBody'), creatorsBodyHtml());
    }
    else if (t.id === 'importFile' && t.files && t.files[0]) {
      var rd = new FileReader();
      rd.onload = async function () {
        try {
          var d = JSON.parse(rd.result);
          if (!d || typeof d.creators !== 'object') throw new Error('bad');
          var list = Object.keys(d.creators).map(function (id) { return normCreator(d.creators[id]); });
          if (!(d.version >= 3)) list.forEach(function (c) { if (c.status === 'cold') c.status = 'none'; });
          list.forEach(function (c) { data.creators[c.id] = c; });
          if (d.hidden && typeof d.hidden === 'object') Object.keys(d.hidden).forEach(function (k) { data.hidden[k] = true; });
          var pl = Array.isArray(d.pitches) ? d.pitches.filter(function (p) { return p && p.id && p.creatorId && Array.isArray(p.keys); }) : [];
          pl.forEach(function (p) { data.pitches = data.pitches.filter(function (x) { return x.id !== p.id; }); data.pitches.push(p); });
          if (d.subs && Array.isArray(d.subs.list) && d.subs.list.length) data.subs = d.subs;
          if (d.rules && typeof d.rules === 'object') { loadRules(d.rules); await persist.meta('rules', rules); }
          dirty();
          await dbPutMany('creators', list); await persist.meta('hidden', data.hidden);
          if (pl.length) await dbPutMany('pitches', pl);
          await persist.meta('subs', data.subs);
          ui.subSel = null; render(true);
          toast('Imported ' + plural(list.length, 'creator') + '.');
        } catch (er) { toast('That file is not a Sponsor Radar backup.'); }
      };
      rd.readAsText(t.files[0]);
      t.value = '';
    }
  });

  window.__sr = { analyze: analyze, extractEmails: extractEmails, pageEmails: pageEmails, data: function () { return data; } };
  init().then(function () { render(false); }).catch(function (e) { $('#app').innerHTML = '<div class="card bad">Could not start: ' + esc(e && e.message) + '</div>'; });
})();
</script>
</body>
